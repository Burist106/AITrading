name: Aurum checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
          cache: pip
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Worker dependencies
        run: pnpm worker:install
      - name: Run Bootstrap quality gates
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_NO_UPDATE_NOTIFIER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Start localhost-only Supabase
        run: pnpm db:start
      - name: Reset local database from zero
        run: pnpm db:reset
      - name: Verify a second deterministic reset
        run: pnpm db:reset
      - name: Lint the local database schema
        run: pnpm db:lint
      - name: Run pgTAP and concurrent database tests
        run: pnpm db:test
      - name: Verify generated database types
        run: pnpm db:types:check
      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: pnpm db:stop

  windows-mt5-boundary:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.7
          cache: pip
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Worker and official MT5 boundary
        run: pnpm worker:install:mt5
      - name: Verify exact MT5 package and import
        shell: pwsh
        run: |
          $version = & .venv/Scripts/python.exe -c "import importlib.metadata; print(importlib.metadata.version('MetaTrader5'))"
          if ($version -ne "5.0.6090") { throw "Unexpected MetaTrader5 package version" }
          & .venv/Scripts/python.exe -c "import MetaTrader5"
      - name: Run native wrapper unit tests
        run: .venv/Scripts/python.exe -m pytest apps/worker/tests/test_mt5_native.py apps/worker/tests/test_mt5_models.py
      - name: Run secret and runtime boundary scanners
        run: pnpm security
